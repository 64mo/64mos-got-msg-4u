<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Message For You</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; overflow: hidden; color: #fff; background: radial-gradient(ellipse at 50% 42%, #292338 0%, #17151e 42%, #0d0c11 100%); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { text-align: center; padding: 2rem; animation: arrive 700ms cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin: 0 0 1.1rem; color: #c7b4f5; font-size: clamp(.72rem, 2vw, .88rem); font-weight: 700; letter-spacing: .28em; text-transform: uppercase; }
    a { display: inline-block; color: inherit; font-size: clamp(2.5rem, 9vw, 7rem); line-height: .98; letter-spacing: -.07em; font-weight: 900; text-decoration: none; text-shadow: 0 8px 50px #a17aff30; transition: color 180ms ease, transform 180ms ease, text-shadow 180ms ease; }
    a:hover, a:focus-visible { color: #d7c2ff; transform: scale(1.035); text-shadow: 0 8px 60px #a17aff70; outline: none; }
    .period { color: #bd9cff; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A special announcement</p>
    <a href="#" aria-label="64mos made this">64mos made this<span class="period">.</span></a>
  </main>
</body>
</html>
