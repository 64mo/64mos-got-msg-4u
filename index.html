<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A Message For You</title><style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;color:#fff;background:radial-gradient(ellipse at 50% 42%,#292338 0%,#17151e 42%,#0d0c11 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{text-align:center;padding:2rem;animation:arrive 700ms cubic-bezier(.2,.8,.2,1) both}.eyebrow{margin:0 0 1.1rem;color:#c7b4f5;font-size:clamp(.72rem,2vw,.88rem);font-weight:700;letter-spacing:.28em;text-transform:uppercase}#open{display:inline-block;color:inherit;font-size:clamp(2.5rem,9vw,7rem);line-height:.98;letter-spacing:-.07em;font-weight:900;text-decoration:none;text-shadow:0 8px 50px #a17aff30;transition:color 180ms ease,transform 180ms ease,text-shadow 180ms ease;border:0;background:none;cursor:pointer;font-family:inherit}#open:hover,#open:focus-visible{color:#d7c2ff;transform:scale(1.035);text-shadow:0 8px 60px #a17aff70;outline:none}.period{color:#bd9cff}dialog{width:min(92vw,760px);max-height:92vh;padding:1rem;border:1px solid #ffffff30;border-radius:18px;background:#14121cf5;color:white;box-shadow:0 24px 100px #000b}dialog::backdrop{background:#05040bd9;backdrop-filter:blur(7px)}.popup-image{display:block;width:100%;max-height:72vh;object-fit:contain;border-radius:10px}.caption{margin:.8rem 0 .25rem;text-align:center;font-size:clamp(1.5rem,5vw,2.5rem);font-weight:900;letter-spacing:.02em}.close{display:block;margin:.8rem auto 0;padding:.55rem 1rem;border:1px solid #ffffff50;border-radius:999px;background:transparent;color:white;font:inherit;cursor:pointer}.close:hover{background:#ffffff18}@keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){main{animation:none}#open{transition:none}}
</style></head><body><main><p class="eyebrow">A special announcement</p><button id="open" type="button" aria-haspopup="dialog">You're a dumbass fuck outta here<span class="period">.</span></button></main><dialog id="popup" aria-label="Surprise"><img class="popup-image" src="Goobas.png" alt="Goobas"><p class="caption">run u neegy</p><button class="close" type="button">Close</button></dialog><script>const popup=document.getElementById('popup');document.getElementById('open').addEventListener('click',()=>popup.showModal());document.querySelector('.close').addEventListener('click',()=>popup.close());popup.addEventListener('click',e=>{if(e.target===popup)popup.close()});</script></body></html>
